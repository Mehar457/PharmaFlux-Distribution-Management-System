{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5>+ Record New Purchase</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Vendor *</label>
                        <select name="vendor" class="form-control" required>
                            <option value="">-- Select Vendor --</option>
                            {% for vendor in vendors %}
                            <option value="{{ vendor.id }}">{{ vendor.company_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Medicine *</label>
                        <select name="stock" class="form-control" required>
                            <option value="">-- Select Medicine --</option>
                            {% for stock in stocks %}
                            <option value="{{ stock.id }}">{{ stock.medicine_name }} (Current: {{ stock.quantity }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Quantity *</label>
                            <input type="number" name="quantity"
                                   class="form-control" min="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Purchase Price (Rs.) *</label>
                            <input type="number" name="purchase_price"
                                   class="form-control" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            Record Purchase
                        </button>
                        <a href="/purchases/" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
