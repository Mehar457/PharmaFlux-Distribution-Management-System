{% extends 'base.html' %}
{% block content %}

<h3>📈 Profit / Loss Report</h3>

<form method="GET" class="mb-3">
    <div class="row g-2">
        <div class="col-md-4">
            <label class="form-label">Start Date</label>
            <input type="date" name="start_date"
                   class="form-control" value="{{ start_date }}">
        </div>
        <div class="col-md-4">
            <label class="form-label">End Date</label>
            <input type="date" name="end_date"
                   class="form-control" value="{{ end_date }}">
        </div>
        <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-primary w-100">Generate Report</button>
        </div>
    </div>
</form>

<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card bg-primary text-white">
            <div class="card-body text-center">
                <h6>Total Sales</h6>
                <h3>Rs. {{ total_sales }}</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-danger text-white">
            <div class="card-body text-center">
                <h6>Total Purchases</h6>
                <h3>Rs. {{ total_purchases }}</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card {% if status == 'Profit' %}bg-success{% else %}bg-warning{% endif %} text-white">
            <div class="card-body text-center">
                <h6>Net {{ status }}</h6>
                <h3>Rs. {{ profit_loss }}</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-info text-white">
            <div class="card-body text-center">
                <h6>Profit Margin</h6>
                <h3>{{ margin }}%</h3>
            </div>
        </div>
    </div>
</div>

<div class="mt-3">
    <button onclick="window.print()" class="btn btn-primary">🖨️ Print Report</button>
    <a href="/reports/sales/" class="btn btn-secondary">Sale Report</a>
    <a href="/reports/purchases/" class="btn btn-secondary">Purchase Report</a>
</div>
{% endblock %}
