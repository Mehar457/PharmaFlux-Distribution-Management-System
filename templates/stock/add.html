{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5>+ Add New Medicine</h5>
            </div>
            <div class="card-body">

                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Medicine Name *</label>
                        <input type="text" name="medicine_name"
                               class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Batch Number *</label>
                        <input type="text" name="batch_no"
                               class="form-control" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Quantity *</label>
                            <input type="number" name="quantity"
                                   class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Reorder Level *</label>
                            <input type="number" name="reorder_level"
                                   class="form-control" min="0" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Unit Price (Rs.) *</label>
                            <input type="number" name="unit_price"
                                   class="form-control" step="0.01" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Expiry Date *</label>
                            <input type="date" name="expiry_date"
                                   class="form-control" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            Save Medicine
                        </button>
                        <a href="/stock/" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
