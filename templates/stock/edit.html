{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-warning">
                <h5>✏️ Edit Medicine</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Medicine Name</label>
                        <input type="text" name="medicine_name"
                               class="form-control"
                               value="{{ stock.medicine_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Batch Number</label>
                        <input type="text" class="form-control"
                               value="{{ stock.batch_no }}" disabled>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Quantity</label>
                            <input type="number" name="quantity"
                                   class="form-control"
                                   value="{{ stock.quantity }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Reorder Level</label>
                            <input type="number" name="reorder_level"
                                   class="form-control"
                                   value="{{ stock.reorder_level }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Unit Price (Rs.)</label>
                            <input type="number" name="unit_price"
                                   class="form-control" step="0.01"
                                   value="{{ stock.unit_price }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Expiry Date</label>
                            <input type="date" name="expiry_date"
                                   class="form-control"
                                   value="{{ stock.expiry_date }}" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            Update Medicine
                        </button>
                        <a href="/stock/" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
