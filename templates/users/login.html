<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PharmaFlux - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">
    <style>
        body {
            background: linear-gradient(
                135deg, #1a2035, #2d3a5e
            );
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-title {
            color: #1a2035;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        .login-subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .btn-login {
            background: #1a2035;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-login:hover {
            background: #2d3a5e;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="login-title">💊 PharmaFlux</h3>
    <p class="login-subtitle">
        Pharmaceutical Distribution System
    </p>

    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">
                Username
            </label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   required>
        </div>
        <div class="mb-3">
            <label class="form-label">
                Password
            </label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>
        </div>
        <button type="submit" class="btn-login">
            Login
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
